apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedrepos
  annotations:
    description: >-
      Backing template for the K8sAllowedRepos constraint. Requires every
      container image to come from an approved registry prefix.
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRepos
      validation:
        openAPIV3Schema:
          type: object
          properties:
            repos:
              description: Allowed image prefixes. An image must start with one of these.
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedrepos

        violation[{"msg": msg}] {
          c := input_containers[_]
          not image_allowed(c.image)
          msg := sprintf(
            "container <%v> image <%v> is not from an approved registry; allowed prefixes: %v",
            [c.name, c.image, input.parameters.repos],
          )
        }

        image_allowed(image) {
          startswith(image, input.parameters.repos[_])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
