apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: user-auth-service
  namespace: prod-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-auth-service
  template:
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      labels:
        app: user-auth-service
    spec:
      containers:
        - name: app
          image: gcr.io/enterprise-platform/user-auth-app:v2.0.0-broken
