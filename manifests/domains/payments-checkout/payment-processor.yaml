apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: payment-processor
  namespace: prod-payments
  labels:
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      labels:
        app: payment-processor
    spec:
      containers:
        - name: app
          image: bash:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: Mandatory environment variable DATABASE_URL is missing!"
                exit 1
              fi
              echo "Starting payment service..."