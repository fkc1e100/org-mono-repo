apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: memory-cache-service
  namespace: prod-caching
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-cache-service
  template:
    metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
      labels:
        app: memory-cache-service
    spec:
      containers:
        - name: cache-worker
          image: redis:7-alpine
          resources:
            requests:
              cpu: '50m'
              memory: '64Mi'
