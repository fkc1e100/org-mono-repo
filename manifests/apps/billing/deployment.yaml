apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-worker
  namespace: payments
  labels:
    app.kubernetes.io/name: billing-worker
    app.kubernetes.io/component: reconciliation
    app.kubernetes.io/part-of: payment-services
    tier: backend
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    configmanagement.gke.io/cluster-selector: prod-us-central1-c
spec:
  replicas: 8
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-worker
        app.kubernetes.io/component: reconciliation
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: gcr.io/pantheon-compute-ui/billing-worker:v2.4.1
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command: ["/bin/billing-worker"]
        args: ["--reconcile-interval=30s", "--log-level=info"]
        resources:
          requests:
            cpu: "250m"
            memory: "768Mi"
          limits:
            cpu: "500m"
            memory: "1024Mi"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GCP_PROJECT
          value: "pantheon-compute-ui"
        ports:
        - name: http-metrics
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
