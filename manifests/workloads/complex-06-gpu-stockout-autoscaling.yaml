apiVersion: apps/v1
kind: Deployment
metadata:
  name: wl-complex-06-llm-batch-inference
  namespace: default
  labels:
    test.kube-agents.io/workload: complex-06
    test.kube-agents.io/failure-type: GPUStockoutAutoscalingFailure
spec:
  replicas: 8
  selector:
    matchLabels:
      app: llm-batch-inference
  template:
    metadata:
      labels:
        app: llm-batch-inference
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
        cloud.google.com/gke-accelerator: "nvidia-tesla-a100"
        node.kubernetes.io/instance-type: "a2-ultragpu-1g"
        topology.kubernetes.io/zone: "us-central1-a"
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: llm-worker
        image: gcr.io/kaggle-gpu-images/python:latest
        command: ["python3", "-c", "import time; print('Starting LLM Inference Worker...'); time.sleep(3600)"]
        resources:
          requests:
            cpu: "12"
            memory: "85Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "12"
            memory: "85Gi"
            nvidia.com/gpu: "1"
