apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-fleet-platform-governance
  namespace: argocd
  labels:
    tier: platform
    domain: governance
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/fkc1e100/org-mono-repo.git
    targetRevision: main
    path: manifests/domains/platform-governance
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
---
