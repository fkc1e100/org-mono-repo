apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: event-exporter
    app.kubernetes.io/component: event-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-exporter
    spec:
      serviceAccountName: event-monitoring-sa
      tolerations:
      - operator: Exists
      containers:
      - name: event-watcher
        image: registry.k8s.io/event-exporter:v0.9.3
        command:
        - /usr/local/bin/event-exporter
        args:
        - --cluster-name=cluster-03
        - --owner=platform
        - --reason=Failed,FailedToDrainNode,CrashLoopBackOff,BackOff,ImagePullBackOff,ErrImagePull,OOMKilled
        - --dedup-window=24h
        env:
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-monitoring-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: event-monitoring-sa-role
rules:
- apiGroups: [""]
  resources: ["events", "pods", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: event-monitoring-sa-binding
subjects:
- kind: ServiceAccount
  name: event-monitoring-sa
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: event-monitoring-sa-role
  apiGroup: rbac.authorization.k8s.io
